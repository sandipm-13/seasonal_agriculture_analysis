# .github/workflows/generate_plots.yml
name: Generate and Push Plots Automatically

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-plot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib seaborn scipy jupyter nbconvert ipykernel

      - name: Ensure output folder exists
        run: mkdir -p outputs/plots

      - name: Execute notebook (regenerates plots + outputs)
        run: |
          jupyter nbconvert --to notebook --execute --inplace SAPA.ipynb

      - name: Commit and Push Plots + Notebook
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/plots/*.png SAPA.ipynb
          git diff-index --quiet HEAD || git commit -m "Automated plot + notebook update [skip ci]"
          git push
